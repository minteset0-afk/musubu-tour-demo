<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSUBU · 가상 업체 소개</title><link rel="stylesheet" href="shops.css"><style>body{margin:0;font-family:system-ui,sans-serif;background:#f3f7f5;color:#18241f}h1{color:#0e5c49}li{padding:8px}p{line-height:1.7}</style></head><body><main class="demo-page"><a href="index.html#shops">← MUSUBU로 돌아가기</a><p class="demo-banner">발표 테스트용 가상 업체 소개 페이지입니다. 실제 업체의 공식 홈페이지가 아니며 주소·전화번호·메뉴는 가상 정보입니다. 예약·주문·결제는 지원하지 않습니다.</p><h1 id="name">가상 업체 소개</h1><img id="photo" alt="가상 업체 참고 이미지" hidden><p id="description"></p><ul id="products"></ul><p id="hours"></p></main><script src="shops.js"></script><script>const shop=window.MUSUBU_SHOPS.find(s=>s.shop_id===new URLSearchParams(location.search).get('shop'));if(shop){document.title=shop.name+' · MUSUBU DEMO';document.getElementById('name').textContent=shop.name;const photo=document.getElementById('photo');photo.hidden=false;photo.src=shop.image_url;photo.onerror=()=>{photo.onerror=null;photo.src='assets/shop-placeholder.svg'};document.getElementById('description').textContent=shop.description;document.getElementById('hours').textContent='가상 영업시간: '+shop.business_hours;shop.products.forEach(p=>{const li=document.createElement('li');li.textContent=p.name+' · '+p.price;document.getElementById('products').append(li)})}else{document.getElementById('description').textContent='상점을 찾을 수 없습니다. MUSUBU에서 상점을 다시 선택해주세요.'}</script></body></html>
